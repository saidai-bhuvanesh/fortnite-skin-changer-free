<!-- Command Palette Modal -->
<div class="command-palette" id="commandPalette">
    <div class="command-backdrop" onclick="closeCommandPalette()"></div>
    <div class="command-modal">
        <div class="command-header">
            <input type="text" id="commandInput" placeholder="Type a command or search..." autocomplete="off">
            <button class="command-close" onclick="closeCommandPalette()">×</button>
        </div>
        <div class="command-list" id="commandList">
            <div class="command-item" data-command="summarize">
                <span class="command-icon">📄</span>
                <div class="command-info">
                    <div class="command-name">/summarize</div>
                    <div class="command-desc">Summarize a document or text</div>
                </div>
            </div>
            <div class="command-item" data-command="linkedin">
                <span class="command-icon">💼</span>
                <div class="command-info">
                    <div class="command-name">/generate linkedin post</div>
                    <div class="command-desc">Create a LinkedIn post</div>
                </div>
            </div>
            <div class="command-item" data-command="resume">
                <span class="command-icon">📋</span>
                <div class="command-info">
                    <div class="command-name">/analyze resume</div>
                    <div class="command-desc">Analyze resume content</div>
                </div>
            </div>
            <div class="command-item" data-command="project">
                <span class="command-icon">🚀</span>
                <div class="command-info">
                    <div class="command-name">/create project idea</div>
                    <div class="command-desc">Generate project ideas</div>
                </div>
            </div>
            <div class="command-item" data-command="theme">
                <span class="command-icon">🎨</span>
                <div class="command-info">
                    <div class="command-name">/switch theme</div>
                    <div class="command-desc">Change color theme</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Theme Selector -->
<div class="theme-selector" id="themeSelector">
    <button class="theme-toggle" onclick="toggleThemeSelector()" title="Change Theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>
    <div class="theme-panel">
        <h4>Choose Theme</h4>
        <div class="theme-options">
            <div class="theme-option active" data-theme="cyberpunk" onclick="switchTheme('cyberpunk')">
                <div class="theme-preview" style="background: linear-gradient(135deg, #00f7ff, #a066ff, #ff2df4)"></div>
                <span>Cyberpunk</span>
            </div>
            <div class="theme-option" data-theme="hacker" onclick="switchTheme('hacker')">
                <div class="theme-preview" style="background: linear-gradient(135deg, #00ff88, #39ff14)"></div>
                <span>Hacker</span>
            </div>
            <div class="theme-option" data-theme="neon-blue" onclick="switchTheme('neon-blue')">
                <div class="theme-preview" style="background: linear-gradient(135deg, #4d9fff, #00d4ff)"></div>
                <span>Neon Blue</span>
            </div>
            <div class="theme-option" data-theme="minimal" onclick="switchTheme('minimal')">
                <div class="theme-preview" style="background: linear-gradient(135deg, #f0f0f0, #d0d0d0)"></div>
                <span>Minimal</span>
            </div>
            <div class="theme-option" data-theme="aurora" onclick="switchTheme('aurora')">
                <div class="theme-preview" style="background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1)"></div>
                <span>Aurora</span>
            </div>
        </div>
    </div>
</div>

<!-- Voice Control Button -->
<button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="Voice Input">
    <svg class="mic-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
    </svg>
    <div class="voice-wave"></div>
</button>

<!-- Activity Timeline -->
<div class="activity-timeline" id="activityTimeline">
    <button class="timeline-toggle" onclick="toggleTimeline()" title="Activity Timeline">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
    </button>
    <div class="timeline-panel">
        <div class="timeline-header">
            <h3>Today's Activity</h3>
            <button class="timeline-close" onclick="toggleTimeline()">×</button>
        </div>
        <div class="timeline-content" id="timelineContent">
            <!-- Activities will be added here dynamically -->
        </div>
    </div>
</div>

<!-- Hologram Background Layer -->
<div class="hologram-layer">
    <div class="hologram-grid"></div>
    <div class="hologram-hexagons"></div>
    <div class="hologram-particles"></div>
</div>
